<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="tbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12100d" />
      <stop offset="45%" stop-color="#241b14" />
      <stop offset="85%" stop-color="#14110e" />
      <stop offset="100%" stop-color="#0a0907" />
    </linearGradient>
    <radialGradient id="tbGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#deb47a" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7a5526" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#12100d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tbMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0d6c5" />
      <stop offset="60%" stop-color="#9e917d" />
      <stop offset="100%" stop-color="#574d3f" />
    </linearGradient>
  </defs>

  <!-- Fundo Escuro Nobre com Luz Quente na Esquerda -->
  <rect width="800" height="350" fill="url(#tbBg)" />
  <circle cx="160" cy="160" r="180" fill="url(#tbGlow)" />

  <!-- Silhueta da Escultura Clássica na Esquerda -->
  <g transform="translate(130, 45)" opacity="0.85">
    <ellipse cx="0" cy="55" rx="38" ry="46" fill="url(#tbMarble)" />
    <path d="M -35 45 Q 0 20 35 45 Q 25 70 35 85 Q -10 95 -35 70 Z" fill="#7d7260" />
    <circle cx="-25" cy="35" r="14" fill="#a39682" />
    <circle cx="25" cy="35" r="14" fill="#a39682" />

    <path d="M -4 50 L 2 72 L 10 74" stroke="#54493a" stroke-width="2.5" fill="none" />
    <ellipse cx="0" cy="90" rx="8" ry="4" fill="#5e5241" />

    <path d="M -16 95 L -20 135 L 20 135 L 16 95 Z" fill="url(#tbMarble)" />
    <path d="M -75 140 Q 0 115 75 140 L 65 240 L -65 240 Z" fill="url(#tbMarble)" />
    <path d="M -50 145 Q 0 170 50 150" stroke="#4a3f31" stroke-width="3" fill="none" />
  </g>

  <!-- Quadros Difusos Iluminados ao Fundo -->
  <rect x="270" y="50" width="70" height="120" rx="2" fill="#2d1f14" stroke="#7a5526" stroke-width="1.5" opacity="0.6" />
  <circle cx="305" cy="95" r="18" fill="#c49358" opacity="0.6" />

  <rect x="360" y="70" width="60" height="100" rx="2" fill="#1f1812" stroke="#5c411d" stroke-width="1.5" opacity="0.5" />
</svg>

