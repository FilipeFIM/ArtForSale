<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700" fill="none">
  <defs>
    <linearGradient id="brushGoldL1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#dfc294" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#cfb68f" stop-opacity="0.22"/>
      <stop offset="85%" stop-color="#e8dac3" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5efe6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brushGoldL2" x1="0%" y1="20%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#b38a54" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#c9a777" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ebdcc5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brushWashL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8c5a4" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#ecd9c0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fdfbf7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Camada 1: Grande mancha de aguada suave de fundo -->
  <path d="M-40,20 Q120,40 240,140 Q340,220 380,340 Q410,430 330,520 Q240,610 80,640 Q-20,650 -60,620 Z" fill="url(#brushWashL)" />

  <!-- Camada 2: Pincelada principal longa diagonal (superior esquerda para centro) -->
  <path d="M-30,50 C60,40 180,85 290,165 C385,235 430,310 445,395 C460,480 395,540 280,565 C170,590 50,560 -20,530 C120,470 280,440 330,370 C375,305 340,230 240,160 C150,95 30,70 -30,50 Z" fill="url(#brushGoldL1)" />

  <!-- Camada 3: Cerdas e estrias de tinta texturizada -->
  <path d="M-20,95 Q130,120 250,210 Q350,285 390,380 Q340,320 220,240 Q110,170 -20,130 Z" fill="url(#brushGoldL2)" />
  <path d="M-30,160 Q90,175 195,255 Q290,330 330,420 Q290,360 180,290 Q80,240 -30,200 Z" fill="url(#brushGoldL1)" opacity="0.8" />
  <path d="M-10,230 Q80,250 160,330 Q230,400 270,490 Q220,435 150,375 Q70,325 -10,270 Z" fill="url(#brushGoldL2)" opacity="0.7" />

  <!-- Camada 4: Salpicos e pinceladas dinâmicas secundárias -->
  <path d="M80,70 C140,80 200,120 240,160 C190,140 130,105 80,70 Z" fill="#cfb68f" opacity="0.28"/>
  <path d="M190,150 C270,210 330,280 360,340 C320,290 250,220 190,150 Z" fill="#dfc294" opacity="0.22"/>
  <path d="M260,260 C320,330 370,410 390,470 C365,410 310,340 260,260 Z" fill="#b38a54" opacity="0.18"/>
  
  <!-- Pingos sutis / respingos orgânicos de ateliê -->
  <circle cx="340" cy="180" r="3.5" fill="#dfc294" opacity="0.35"/>
  <circle cx="410" cy="285" r="4.5" fill="#cfb68f" opacity="0.30"/>
  <circle cx="385" cy="480" r="3" fill="#dfc294" opacity="0.25"/>
  <circle cx="295" cy="540" r="4" fill="#c9a777" opacity="0.28"/>
  <circle cx="170" cy="590" r="2.5" fill="#dfc294" opacity="0.20"/>
</svg>
