<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 60" width="290" height="60" fill="none">
  <defs>
    <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="40%" stop-color="#b38a54" />
      <stop offset="70%" stop-color="#916c3b" />
      <stop offset="100%" stop-color="#caa267" />
    </linearGradient>
    <linearGradient id="goldLightWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67c4f" />
      <stop offset="50%" stop-color="#dfc08a" />
      <stop offset="100%" stop-color="#8e6538" />
    </linearGradient>
  </defs>
  
  <!-- Monograma A estilizado em fitas geométricas douradas -->
  <g transform="translate(6, 6)">
    <!-- Perna esquerda / diagonal -->
    <path d="M 22 2 L 6 46 L 13 46 L 25 12 Z" fill="url(#goldGradWhite)" />
    <!-- Perna direita com dobra e profundidade -->
    <path d="M 21 2 L 40 46 L 33 46 L 19 12 Z" fill="url(#goldLightWhite)" />
    <!-- Barra horizontal transversal conectando -->
    <path d="M 12 33 L 34 33 L 31 38 L 10 38 Z" fill="url(#goldGradWhite)" opacity="0.95" />
    <!-- Vértice superior sutil -->
    <polygon points="21.5,1 25,12 18,12" fill="#e8d3a7" />
  </g>

  <!-- Tipografia ART FOR SALE em Branco Nobre para fundos escuros -->
  <text x="64" y="28" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="20.5" font-weight="600" letter-spacing="2.6" fill="#ffffff">ART FOR SALE</text>
  
  <!-- Slogan -->
  <text x="64" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9.5" font-style="italic" font-weight="400" letter-spacing="0.8" fill="#dfd9cf">Arte que transforma espaços.</text>
</svg>
