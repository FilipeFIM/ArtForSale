<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <radialGradient id="portraitGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4d3527" />
      <stop offset="60%" stop-color="#21150e" />
      <stop offset="100%" stop-color="#0d0805" />
    </radialGradient>
    <linearGradient id="skinRenaissance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae3d2" />
      <stop offset="50%" stop-color="#e8bda2" />
      <stop offset="100%" stop-color="#ad7150" />
    </linearGradient>
  </defs>
  <rect width="300" height="240" fill="url(#portraitGlow)" />
  
  <!-- Retrato Feminino Renascentista (Jovem com Cabelos Cacheados) -->
  <g transform="translate(150, 45)">
    <!-- Volume dos cabelos castanhos volumosos -->
    <ellipse cx="0" cy="50" rx="72" ry="75" fill="#3b2214" />
    <circle cx="-50" cy="50" r="28" fill="#4d2f1d" />
    <circle cx="50" cy="50" r="28" fill="#4d2f1d" />
    <circle cx="-35" cy="85" r="25" fill="#331c0e" />
    <circle cx="35" cy="85" r="25" fill="#331c0e" />
    
    <!-- Face -->
    <ellipse cx="0" cy="58" rx="42" ry="54" fill="url(#skinRenaissance)" />
    
    <!-- Olhos expressivos -->
    <ellipse cx="-16" cy="48" rx="7" ry="5" fill="#ffffff" />
    <circle cx="-16" cy="48" r="3.5" fill="#29150b" />
    <ellipse cx="16" cy="48" rx="7" ry="5" fill="#ffffff" />
    <circle cx="16" cy="48" r="3.5" fill="#29150b" />
    <!-- Sobrancelhas -->
    <path d="M -26 40 Q -16 35 -6 41" stroke="#3b2111" stroke-width="2" fill="none" />
    <path d="M 6 41 Q 16 35 26 40" stroke="#3b2111" stroke-width="2" fill="none" />
    <!-- Nariz sutil -->
    <path d="M -2 46 L 0 68 L 6 70" stroke="#874e2d" stroke-width="1.8" fill="none" />
    <!-- Lábios clássicos -->
    <path d="M -12 84 Q 0 81 12 84 Q 0 95 -12 84" fill="#a84338" />
    
    <!-- Vestimenta elegante de época -->
    <path d="M -60 120 Q 0 100 60 120 L 75 195 L -75 195 Z" fill="#1b2e2b" />
    <path d="M -25 110 Q 0 135 25 110 L 30 195 L -30 195 Z" fill="#997042" />
  </g>
</svg>

