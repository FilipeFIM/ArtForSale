<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="cuSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1833" />
      <stop offset="35%" stop-color="#4a2545" />
      <stop offset="65%" stop-color="#964344" />
      <stop offset="85%" stop-color="#d9753b" />
      <stop offset="100%" stop-color="#fca853" />
    </linearGradient>
    <linearGradient id="cuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2" />
      <stop offset="50%" stop-color="#e8a838" />
      <stop offset="100%" stop-color="#995817" />
    </linearGradient>
    <linearGradient id="cuWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#733b3b" />
      <stop offset="30%" stop-color="#3d212f" />
      <stop offset="100%" stop-color="#120c1a" />
    </linearGradient>
  </defs>

  <!-- Céu de crepúsculo urbano gradiente dramático -->
  <rect width="480" height="240" fill="url(#cuSky)" />

  <!-- Sol poente difuso no horizonte metropolitano -->
  <circle cx="280" cy="180" r="42" fill="#ffe299" opacity="0.65" filter="blur(8px)" />
  <circle cx="280" cy="180" r="24" fill="#ffffff" opacity="0.8" />

  <!-- Silhuetas da Arquitetura Urbana e Edifícios em Camadas -->
  <g opacity="0.95">
    <!-- Camada 1: Edifícios ao longe (violeta escuro) -->
    <rect x="30" y="110" width="35" height="120" fill="#321e3b" />
    <rect x="75" y="90" width="40" height="140" fill="#2d1933" />
    <polygon points="75,90 95,65 115,90" fill="#2d1933" />
    <rect x="125" y="130" width="30" height="100" fill="#382142" />
    <rect x="170" y="80" width="45" height="150" fill="#26142e" />
    <rect x="230" y="105" width="38" height="125" fill="#351d3d" />
    <rect x="310" y="70" width="50" height="160" fill="#26152e" />
    <line x1="335" y1="70" x2="335" y2="40" stroke="#26152e" stroke-width="2" />
    <rect x="375" y="115" width="42" height="115" fill="#321c3b" />
    <rect x="425" y="95" width="35" height="135" fill="#26132b" />

    <!-- Camada 2: Edifícios em primeiro plano (grafite/antracite com janelas luminosas) -->
    <rect x="10" y="145" width="55" height="95" fill="#140c17" />
    <rect x="85" y="125" width="50" height="115" fill="#170d1c" />
    <rect x="150" y="110" width="60" height="130" fill="#120a14" />
    <rect x="225" y="135" width="45" height="105" fill="#190e1f" />
    <rect x="285" y="120" width="55" height="120" fill="#140b17" />
    <rect x="355" y="100" width="65" height="140" fill="#110914" />
    <rect x="430" y="130" width="45" height="110" fill="#160d1c" />

    <!-- Luzes das janelas douradas/âmbar acendendo no entardecer -->
    <g fill="url(#cuGold)" opacity="0.85">
      <rect x="95" y="135" width="4" height="6" />
      <rect x="105" y="135" width="4" height="6" />
      <rect x="115" y="135" width="4" height="6" />
      <rect x="95" y="150" width="4" height="6" />
      <rect x="115" y="150" width="4" height="6" />
      <rect x="165" y="125" width="5" height="7" />
      <rect x="180" y="125" width="5" height="7" />
      <rect x="165" y="140" width="5" height="7" />
      <rect x="195" y="140" width="5" height="7" />
      <rect x="180" y="155" width="5" height="7" />
      <rect x="295" y="135" width="4" height="6" />
      <rect x="310" y="135" width="4" height="6" />
      <rect x="325" y="135" width="4" height="6" />
      <rect x="370" y="115" width="5" height="7" />
      <rect x="385" y="115" width="5" height="7" />
      <rect x="400" y="115" width="5" height="7" />
      <rect x="370" y="130" width="5" height="7" />
      <rect x="400" y="130" width="5" height="7" />
      <rect x="385" y="145" width="5" height="7" />
    </g>
  </g>

  <!-- Espelho d'água / Baía metropolitana com reflexos crepusculares -->
  <rect y="235" width="480" height="85" fill="url(#cuWater)" />

  <!-- Reflexos estilhaçados em espátula sobre a água -->
  <g opacity="0.7">
    <ellipse cx="280" cy="245" rx="55" ry="4" fill="#fca853" />
    <ellipse cx="280" cy="255" rx="42" ry="3" fill="#ffe299" />
    <ellipse cx="275" cy="268" rx="60" ry="3.5" fill="#d9753b" />
    <ellipse cx="285" cy="282" rx="35" ry="2.5" fill="#fca853" />
    <ellipse cx="175" cy="250" rx="25" ry="2.5" fill="#e8a838" opacity="0.6" />
    <ellipse cx="380" cy="248" rx="28" ry="2.5" fill="#e8a838" opacity="0.6" />
  </g>

  <!-- Assinatura sutil de Sofia Ramos -->
  <text x="445" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#e8a838" opacity="0.5" text-anchor="end" letter-spacing="1">SOFIA RAMOS</text>
</svg>

