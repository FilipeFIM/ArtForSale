<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Iluminação da parede da galeria -->
    <radialGradient id="wallLight" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="60%" stop-color="#ece6da" />
      <stop offset="100%" stop-color="#d6cebf" />
    </radialGradient>
    
    <!-- Sombra projetada da tela em perspectiva -->
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="35" dy="25" stdDeviation="22" flood-color="#1a1815" flood-opacity="0.32" />
    </filter>

    <!-- Gradiente do pôr do sol em perspectiva -->
    <linearGradient id="hdSky3D" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="35%" stop-color="#8e44ad" />
      <stop offset="60%" stop-color="#d35400" />
      <stop offset="78%" stop-color="#f39c12" />
      <stop offset="90%" stop-color="#f1c40f" />
      <stop offset="100%" stop-color="#1a1c23" />
    </linearGradient>

    <!-- Brilho na borda da tela esticada -->
    <linearGradient id="canvasEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e502c" />
      <stop offset="50%" stop-color="#b38a54" />
      <stop offset="100%" stop-color="#4a341b" />
    </linearGradient>
  </defs>

  <!-- Parede de Fundo Neutra Premium -->
  <rect width="800" height="600" fill="url(#wallLight)" />

  <!-- Rodapé sutil de galeria -->
  <rect y="540" width="800" height="60" fill="#c4bcad" opacity="0.4" />
  <line x1="0" y1="540" x2="800" y2="540" stroke="#b0a797" stroke-width="2" />

  <!-- Grupo da Tela em Perspectiva Lateral -->
  <g transform="translate(60, 40)" filter="url(#shadow3D)">
    <!-- Borda lateral tridimensional do chassi (Canvas Wrap 4cm) -->
    <polygon points="560,90 588,110 588,435 560,420" fill="url(#canvasEdge)" />

    <!-- Face Frontal Angulada da Pintura (Perspectiva Isométrica Elegante) -->
    <polygon points="120,60 560,90 560,420 120,450" fill="url(#hdSky3D)" />

    <!-- Elementos Internos da Pintura em Perspectiva -->
    <!-- Sol Poente em Perspectiva -->
    <ellipse cx="360" cy="235" rx="65" ry="42" fill="#fff5cc" opacity="0.9" />
    <ellipse cx="360" cy="235" rx="28" ry="18" fill="#ffffff" />

    <!-- Linha do horizonte e relevo -->
    <polygon points="120,240 560,245 560,265 120,260" fill="#1b1510" />

    <!-- Reflexos Dourados na Água em Perspectiva -->
    <polygon points="120,260 560,265 560,420 120,450" fill="#161b22" opacity="0.8" />
    <ellipse cx="360" cy="285" rx="70" ry="12" fill="#f1c40f" opacity="0.85" />
    <ellipse cx="365" cy="320" rx="95" ry="14" fill="#e67e22" opacity="0.65" />
    <ellipse cx="370" cy="365" rx="120" ry="16" fill="#d35400" opacity="0.45" />

    <!-- Brilho acetinado sobre o verniz -->
    <polygon points="120,60 300,72 260,440 120,450" fill="#ffffff" opacity="0.08" />
  </g>

  <!-- Tag sutil de legenda técnica na imagem lateral -->
  <g transform="translate(40, 565)">
    <circle cx="10" cy="10" r="4" fill="#b38a54" />
    <text x="24" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#7a7367" letter-spacing="1">PERSPECTIVA LATERAL • CHASSI EM MADEIRA NOBRE (4 CM)</text>
  </g>
</svg>

