<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <linearGradient id="etchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eae5da" />
      <stop offset="50%" stop-color="#d6cebd" />
      <stop offset="100%" stop-color="#b8ae9c" />
    </linearGradient>
  </defs>
  <!-- Papel de Gravura Antiga / Papiro Séphia -->
  <rect width="300" height="240" fill="url(#etchBg)" />
  <rect x="15" y="15" width="270" height="210" fill="none" stroke="#6b6051" stroke-width="2" />
  <rect x="20" y="20" width="260" height="200" fill="none" stroke="#877a67" stroke-width="0.75" />

  <!-- Gravura Histórica / Gravadores no Atelier (Hachuras clássicas) -->
  <g stroke="#3d352a" stroke-width="1.2" fill="none">
    <!-- Parede e Janela do Atelier -->
    <path d="M 35 40 L 105 40 L 105 120 L 35 120 Z" />
    <line x1="70" y1="40" x2="70" y2="120" />
    <line x1="35" y1="80" x2="105" y2="80" />

    <!-- Figura Humana 1 (Sentada à Mesa) -->
    <ellipse cx="110" cy="95" rx="14" ry="18" fill="#3d352a" />
    <path d="M 95 115 C 80 150 95 190 135 195 L 145 195 C 150 150 135 125 115 115 Z" fill="#3d352a" />
    <!-- Braços trabalhando -->
    <path d="M 120 130 L 160 145 L 175 140" stroke-width="3" />

    <!-- Figura Humana 2 (Em Pé observando) -->
    <ellipse cx="195" cy="75" rx="12" ry="16" fill="#3d352a" />
    <path d="M 175 95 C 165 130 170 185 190 195 L 210 195 C 220 150 215 110 195 95 Z" fill="#3d352a" />
    <!-- Manto da figura em pé -->
    <path d="M 180 100 Q 215 120 220 185" stroke-width="2" />

    <!-- Prensa de Gravura / Cavalete -->
    <rect x="140" y="135" width="95" height="60" fill="#524637" />
    <line x1="140" y1="195" x2="140" y2="215" stroke-width="4" />
    <line x1="235" y1="195" x2="235" y2="215" stroke-width="4" />

    <!-- Hachuras de Sombra no Chão -->
    <line x1="40" y1="210" x2="270" y2="210" stroke-width="1.5" />
    <line x1="50" y1="215" x2="260" y2="215" stroke-width="1" />
  </g>
</svg>

