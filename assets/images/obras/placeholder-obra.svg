<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191612" />
      <stop offset="100%" stop-color="#0e0d0b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#b38a54" />
      <stop offset="100%" stop-color="#8a6735" />
    </linearGradient>
  </defs>

  <!-- Fundo Sombreado Museu -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Borda Delicada Externa -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#2a251e" stroke-width="1.5" />
  <!-- Moldura Dourada Interna -->
  <rect x="50" y="50" width="700" height="900" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Ícone de Moldura / Cavalete Artístico Central -->
  <g transform="translate(400, 440)">
    <!-- Moldura central -->
    <rect x="-90" y="-100" width="180" height="150" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Paisagem minimalista interior -->
    <circle cx="20" cy="-45" r="14" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M -70 30 L -30 -15 L 15 25 L 45 -5 L 70 30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
    <line x1="-90" y1="30" x2="90" y2="30" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Tipografia de Luxo Art Sale -->
  <text x="400" y="550" text-anchor="middle" fill="#f5f2eb" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="500" letter-spacing="4">
    ART SALE
  </text>
  <text x="400" y="585" text-anchor="middle" fill="#b38a54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3">
    FOTOGRAFIA EM CURADORIA
  </text>
  <text x="400" y="615" text-anchor="middle" fill="#756f64" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" letter-spacing="1">
    Aguardando envio de imagem no painel
  </text>
</svg>
