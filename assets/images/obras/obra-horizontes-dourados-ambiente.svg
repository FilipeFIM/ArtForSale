<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradiente da parede sofisticada do living (greige contemporâneo) -->
    <linearGradient id="livingWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebe7de" />
      <stop offset="70%" stop-color="#dfd9cd" />
      <stop offset="100%" stop-color="#cfc7b7" />
    </linearGradient>

    <!-- Piso em madeira chevron/tauari -->
    <linearGradient id="woodFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73563b" />
      <stop offset="50%" stop-color="#826244" />
      <stop offset="100%" stop-color="#694d34" />
    </linearGradient>

    <!-- Sombra elegante projetada do quadro na parede -->
    <filter id="wallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#14110d" flood-opacity="0.22" />
    </filter>

    <!-- Sombra dos móveis -->
    <filter id="furnitureShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#14110d" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Parede Decorada em Greige Luxo -->
  <rect width="800" height="460" fill="url(#livingWall)" />

  <!-- Boiserie sutil minimalista na parede de fundo -->
  <rect x="50" y="30" width="700" height="400" fill="none" stroke="#d5cebf" stroke-width="1.5" opacity="0.6" />
  <rect x="70" y="50" width="660" height="360" fill="none" stroke="#e0d9cc" stroke-width="1" opacity="0.4" />

  <!-- Piso de Madeira Nobre -->
  <rect y="460" width="800" height="140" fill="url(#woodFloor)" />
  <!-- Rodapé Branco Contemporâneo Alto -->
  <rect y="445" width="800" height="15" fill="#f7f5f0" />
  <line x1="0" y1="445" x2="800" y2="445" stroke="#beb7a7" stroke-width="1" />

  <!-- SPOT DE ILUMINAÇÃO DIRECIONADA NO QUADRO (Galeria Spot 3000K) -->
  <path d="M 400,0 L 220,440 L 580,440 Z" fill="#ffffff" opacity="0.12" />

  <!-- ================= QUADRO CENTRALIZADO NA PAREDE ================= -->
  <g filter="url(#wallShadow)">
    <!-- Moldura Flutuante em Dourado Champagne Escovado -->
    <rect x="236" y="86" width="328" height="208" rx="2" fill="#c29f68" stroke="#947443" stroke-width="2" />
    <!-- Paspatur / Canvas Interior -->
    <rect x="242" y="92" width="316" height="196" fill="#14171d" />

    <!-- A Pintura "Horizontes Dourados" em Proporção no Ambiente -->
    <g transform="translate(242, 92) scale(0.6583, 0.6533)">
      <rect width="480" height="300" fill="#2c3e50" />
      <!-- Céu degrade -->
      <path d="M0,0 H480 V185 H0 Z" fill="#b85d1b" />
      <circle cx="240" cy="165" r="90" fill="#f39c12" />
      <circle cx="240" cy="165" r="30" fill="#ffffff" opacity="0.95" />
      <path d="M 0 166 Q 140 160 240 165 T 480 166 L 480 185 L 0 185 Z" fill="#14110d" />
      <rect y="185" width="480" height="115" fill="#141a21" />
      <ellipse cx="240" cy="205" rx="75" ry="12" fill="#fff2b3" opacity="0.9" />
      <ellipse cx="240" cy="225" rx="110" ry="16" fill="#f1c40f" opacity="0.75" />
      <ellipse cx="240" cy="250" rx="145" ry="16" fill="#e67e22" opacity="0.55" />
    </g>
  </g>

  <!-- ================= MÓVEL CONSOLE DESIGNER ABAIXO ================= -->
  <g filter="url(#furnitureShadow)">
    <!-- Tampo do Aparador / Console em Nogueira Natural -->
    <rect x="180" y="380" width="440" height="14" rx="2" fill="#3d2c1e" />
    <!-- Corpo com Gavetas Ripada em Nogueira -->
    <rect x="190" y="394" width="420" height="60" rx="2" fill="#2b1e14" />
    <!-- Linhas dos Ripados do móvel -->
    <line x1="330" y1="394" x2="330" y2="454" stroke="#1d140d" stroke-width="2" />
    <line x1="470" y1="394" x2="470" y2="454" stroke="#1d140d" stroke-width="2" />
    <!-- Pés metálicos em bronze/preto fosco -->
    <rect x="210" y="454" width="8" height="40" fill="#141414" />
    <rect x="582" y="454" width="8" height="40" fill="#141414" />
  </g>

  <!-- Objeto de Decoração 1: Luminária de Mesa Minimalista (Esquerda) -->
  <ellipse cx="240" cy="380" rx="18" ry="4" fill="#111111" />
  <rect x="238" y="330" width="4" height="50" fill="#b38a54" />
  <ellipse cx="240" cy="330" rx="24" ry="10" fill="#fbf9f4" stroke="#dfc294" stroke-width="1.5" />
  <circle cx="240" cy="335" r="8" fill="#fff3c4" opacity="0.8" />

  <!-- Objeto de Decoração 2: Vaso de Cerâmica Orgânica Escultórica (Direita) -->
  <path d="M 545,380 C 530,365 525,320 540,305 C 550,295 560,295 570,305 C 585,320 580,365 565,380 Z" fill="#e8dfd1" stroke="#d4c8b6" stroke-width="1.5" />
  <!-- Galhos secos elegantes saindo do vaso -->
  <path d="M 555,305 Q 540,250 515,220 M 555,305 Q 570,240 595,210 M 555,290 Q 560,230 550,195" stroke="#635445" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- Selo informativo de visualização em ambiente -->
  <g transform="translate(30, 560)">
    <rect width="250" height="26" rx="4" fill="rgba(20, 18, 15, 0.75)" />
    <text x="12" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#dfc294" letter-spacing="1">SIMULAÇÃO EM LIVING DE ALTO PADRÃO</text>
  </g>
</svg>

