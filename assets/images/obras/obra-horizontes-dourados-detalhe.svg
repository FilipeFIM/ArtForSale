<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Textura de trama do linho/tela de pintura a óleo -->
    <pattern id="canvasWeave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" />
      <path d="M0 4 h8 M4 0 v8" stroke="#000000" stroke-width="0.75" opacity="0.08" />
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" opacity="0.12" />
      <circle cx="6" cy="6" r="0.8" fill="#ffffff" opacity="0.12" />
    </pattern>

    <!-- Gradiente de cor base das pinceladas espessas de ouro e ocre -->
    <radialGradient id="impastoLight" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="25%" stop-color="#ffd460" />
      <stop offset="55%" stop-color="#e67e22" />
      <stop offset="78%" stop-color="#c0392b" />
      <stop offset="92%" stop-color="#6e2d14" />
      <stop offset="100%" stop-color="#24140b" />
    </radialGradient>

    <!-- Filtro de relevo para efeito de tinta espessa a óleo (impasto) -->
    <filter id="oilImpasto" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Fundo com a riqueza cromática do pôr do sol em close-up -->
  <rect width="800" height="600" fill="url(#impastoLight)" />

  <!-- Pinceladas Dinâmicas de Espátula e Óleo Pesado -->
  <g opacity="0.85">
    <!-- Pincelada Dourada Superior -->
    <path d="M 40,110 C 180,60 360,140 580,95 C 680,75 750,115 820,90 L 820,180 C 720,210 590,160 410,210 C 230,260 120,170 40,190 Z" fill="#ffd043" opacity="0.75" />
    
    <!-- Pincelada Amarela Intensa Luminosa -->
    <path d="M -20,220 C 140,180 320,240 520,200 C 660,170 740,240 840,210 L 840,285 C 700,320 540,260 360,305 C 180,350 80,270 -20,310 Z" fill="#fff9db" opacity="0.9" />

    <!-- Camada Ocre e Laranja com Fissuras de Textura -->
    <path d="M 20,320 C 190,280 370,360 590,310 C 700,285 780,340 820,315 L 820,420 C 710,460 570,390 390,440 C 210,490 90,380 20,430 Z" fill="#e67e22" opacity="0.85" />

    <!-- Camada Inferior Vinho e Grafite Noturno -->
    <path d="M -10,430 C 160,390 340,470 540,420 C 680,390 760,460 830,430 L 830,620 L -10,620 Z" fill="#2d1a10" opacity="0.95" />

    <!-- Pinceladas Douradas em Detalhe com Relevo Visual -->
    <ellipse cx="420" cy="245" rx="190" ry="24" fill="#ffffff" opacity="0.8" />
    <ellipse cx="380" cy="275" rx="240" ry="28" fill="#ffeaa7" opacity="0.65" />
    <ellipse cx="440" cy="340" rx="280" ry="22" fill="#f39c12" opacity="0.7" />
  </g>

  <!-- Padrão da trama do linho natural sobreposto -->
  <rect width="800" height="600" fill="url(#canvasWeave)" mix-blend-mode="multiply" />

  <!-- Vinheta sutil e iluminação focada tipo lupa de museu -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#0e0a07" stop-opacity="0.55" />
  </radialGradient>
  <rect width="800" height="600" fill="url(#vignette)" />

  <!-- Selo informativo de ampliação macro -->
  <g transform="translate(30, 560)">
    <rect width="270" height="26" rx="4" fill="rgba(20, 18, 15, 0.75)" />
    <text x="12" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#dfc294" letter-spacing="1">MACRO DETALHE • PINCELADAS A ÓLEO</text>
  </g>
</svg>

