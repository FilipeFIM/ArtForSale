<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <radialGradient id="classGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#dfb784" />
      <stop offset="45%" stop-color="#8c5828" />
      <stop offset="85%" stop-color="#2a180b" />
      <stop offset="100%" stop-color="#140a04" />
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d6ba" />
      <stop offset="60%" stop-color="#d9a57b" />
      <stop offset="100%" stop-color="#945831" />
    </linearGradient>
  </defs>
  <rect width="300" height="240" fill="url(#classGlow)" />
  <!-- Silhueta e Rosto da Dama Clássica com Iluminação Chiaroscuro -->
  <g transform="translate(130, 25)">
    <!-- Cabelo cacheado clássico -->
    <ellipse cx="25" cy="55" rx="48" ry="52" fill="#382012" />
    <!-- Rosto de perfil / 3/4 -->
    <ellipse cx="20" cy="65" rx="34" ry="42" fill="url(#skin)" />
    <!-- Olhos e traços clássicos -->
    <path d="M 12 58 Q 22 55 30 60" stroke="#4a2511" stroke-width="2.5" fill="none" />
    <path d="M 28 62 L 35 78 L 26 80" stroke="#6e371a" stroke-width="2" fill="none" />
    <path d="M 20 92 Q 28 96 36 91" stroke="#872917" stroke-width="2.5" fill="none" />
    <!-- Ombros e Manto Clássico -->
    <path d="M -30 115 Q 15 95 65 110 L 85 200 L -50 200 Z" fill="#2d1c14" />
    <path d="M -10 120 Q 25 140 50 125 L 60 195 L -20 195 Z" fill="#b0844f" opacity="0.85" />
  </g>
</svg>

